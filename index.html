<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Ops - Home</title>
  <link href="style.css" rel="stylesheet">
</head>
<body class="home">
  <!-- Header -->
  <div id="header-placeholder"></div>

  <!-- Bottom-right box -->
  <div id="homeBox">
    <h2>Welcome to Field Ops</h2>
    <p>Find airsoft and paintball fields quickly.</p>
    <button onclick="location.href='fieldfinder.html'">Go to Field Finder</button>
  </div>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script>
    fetch('header.html')
      .then(r => r.text())
      .then(d => document.getElementById('header-placeholder').innerHTML = d);

    fetch('footer.html')
      .then(r => r.text())
      .then(d => document.getElementById('footer-placeholder').innerHTML = d);
  </script>
</body>
</html>
