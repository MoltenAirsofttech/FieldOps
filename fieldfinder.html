<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Map - Field Ops</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>

<body>

<header>
    <nav>
        <a href="index.html">Home</a>
        <a href="fieldmap.html">Field Map</a>
        <a href="groupfinder.html">Group Finder</a>
        <a href="fieldfinder.html">Field Finder</a>
        <a href="fieldpass.html">Field Pass</a>
        <a href="login-signup.html">Login / Signup</a>
    </nav>
</header>

<main>
    <div class="pageLayout">

        <div class="sidePanel"></div>

        <div class="mapWrapper">

            <div id="map"></div>

            <div class="mapSearch">
                <input id="mapSearch" type="text" placeholder="Search location...">
            </div>

            <div id="filterContainer"></div>

        </div>

        <div class="sidePanel"></div>

    </div>
</main>

<footer>
    <p>© Field Ops — Placeholder Footer</p>
</footer>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
(function(){

const firebaseConfig={
    apiKey:"AIzaSyClEyiSXHQ4Tjo8hUKpjlgbGz3Y9fw8ddg",
    authDomain:"fieldops0.firebaseapp.com",
    databaseURL:"https://fieldops0-default-rtdb.firebaseio.com",
    projectId:"fieldops0",
    storageBucket:"fieldops0.appspot.com",
    messagingSenderId:"368782923118",
    appId:"1:368782923118:web:71f392fee8c46fe1209d7f"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.database();

let currentUser = null;
let locations = [];
let markers = [];

const categoryColors={
    "Airsoft Field":"blue",
    "Paintball Field":"red",
    "Store":"green",
    "Event":"orange"
};

let activeCategories=new Set(Object.keys(categoryColors));

const map=L.map("map",{zoomControl:false}).setView([25,-80],5);

L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
    {
        attribution:"© OpenStreetMap © CARTO",
        subdomains:"abcd",
        maxZoom:19
    }
).addTo(map);

L.control.zoom({position:"bottomright"}).addTo(map);

auth.onAuthStateChanged(user => {
    currentUser = user || null;
    loadFields();
});

async function loadFields(){
    const snap = await db.ref("fields").once("value");
    const data = snap.val() || {};
    locations = Object.keys(data).map(k => ({id:k,...data[k]}));
    renderFilters();
    renderMarkers();
}

function createMarker(field){
    const tags = field.tags || [];
    const size = tags.includes("featured")?18:12;
    const htmlSlices = tags.map(tag => `<div style="flex:1;background:${categoryColors[tag]||"gray"}"></div>`).join("");
    const iconHtml = `<div style="width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;display:flex;border:1px solid white;">${htmlSlices}</div>`;
    return L.marker([field.latitude, field.longitude], {
        icon: L.divIcon({
            className:"multi-circle",
            html: iconHtml,
            iconSize:[size,size],
            iconAnchor:[size/2,size/2]
        })
    });
}

function renderMarkers(){
    markers.forEach(m => map.removeLayer(m));
    markers = [];
    locations.forEach(field => {
        const visible = (field.tags||[]).some(tag => activeCategories.has(tag));
        if(visible){
            const marker = createMarker(field);
            marker.addTo(map);
            markers.push(marker);
        }
    });
}

function renderFilters(){
    const container = document.getElementById("filterContainer");
    container.innerHTML = "";
    Object.keys(categoryColors).forEach(tag => {
        const btn = document.createElement("button");
        btn.innerText = tag;
        btn.style.background = activeCategories.has(tag)?categoryColors[tag]:"#ccc";
        btn.style.color = tag==="Event"?"black":"white";
        btn.onclick = () => {
            activeCategories.has(tag) ? activeCategories.delete(tag) : activeCategories.add(tag);
            renderFilters();
            renderMarkers();
        };
        container.appendChild(btn);
    });
}

document.getElementById("mapSearch").addEventListener("keypress", async e => {
    if(e.key === "Enter"){
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(e.target.value)}`);
        const data = await res.json();
        if(data[0]) map.setView([+data[0].lat,+data[0].lon],10);
    }
});

})();
</script>

</body>
</html>
