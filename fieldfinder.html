<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Field Finder - Field Ops</title>
  <link href="style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
  <!-- Header -->
  <div id="header-placeholder"></div>

  <div class="pageContainer">
    <div id="adsSidebar">
      <h3>Ads</h3>
      <p>Place your Google Ads here</p>
    </div>
    <div id="mainContent">
      <div id="map"></div>
      <div style="position:absolute; top:10px; left:50%; transform:translateX(-50%); width:320px;">
        <input id="mapSearch" type="text" placeholder="Search location...">
      </div>
      <div id="filterContainer"></div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-database-compat.js"></script>
  <script src="fieldfinder-script.js"></script>
  <script>
    fetch('header.html').then(r => r.text()).then(d => document.getElementById('header-placeholder').innerHTML = d);
    fetch('footer.html').then(r => r.text()).then(d => document.getElementById('footer-placeholder').innerHTML = d);
  </script>
</body>
</html>
