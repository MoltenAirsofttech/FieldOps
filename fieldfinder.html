<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Finder - Field Ops</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>

<!-- Header -->
<div id="header-placeholder"></div>

<!-- Page Container -->
<div id="pageContainer" style="min-height:90vh;">
  <!-- Ads Sidebar -->
  <aside id="adsSidebar">
    <h3 style="color:#FFA500;">Ads</h3>
    <p>Place your Google ads here</p>
  </aside>

  <!-- Main Map Content -->
  <main id="mainContent">
    <div id="map" style="width:100%; height:90vh;"></div>
    <div style="position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:1001; width:320px;">
      <input id="mapSearch" type="text" placeholder="Search location..." style="width:100%; padding:10px; border-radius:8px; border:1px solid #555; background:#111; color:white; font-size:16px;">
    </div>
    <div id="filterContainer" style="position:absolute; bottom:60px; left:10px; z-index:1000; background:rgba(255,255,255,0.9); padding:10px; border-radius:8px; display:flex; flex-wrap:wrap; gap:4px;"></div>
  </main>
</div>

<!-- Footer -->
<div id="footer-placeholder"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
fetch('header.html')
  .then(r => r.text())
  .then(d => document.getElementById('header-placeholder').innerHTML = d);
fetch('footer.html')
  .then(r => r.text())
  .then(d => document.getElementById('footer-placeholder').innerHTML = d);
</script>

<!-- Map JS (same as your previous map script) -->
<script src="fieldmap-script.js"></script>
</body>
</html>
