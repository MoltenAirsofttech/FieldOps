<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Finder - Field Ops</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
  html, body { height: 100%; margin:0; padding:0; overflow: auto; }
  #pageContainer { display:flex; min-height: 90vh; }
  #adsSidebar { width: 200px; background: rgba(0,0,0,0.7); padding:10px; color:white; font-family:Arial; }
  #mainContent { flex:1; position:relative; }
  #map { width:100%; height:90vh; }
</style>
</head>
<body>

<!-- Header -->
<div id="header-placeholder"></div>

<!-- Page Container -->
<div id="pageContainer">
  <!-- Ads Sidebar -->
  <div id="adsSidebar">
    <h3>Ads</h3>
    <p>Place your Google ads here</p>
  </div>

  <!-- Main Map -->
  <div id="mainContent">
    <div id="map"></div>
    <div style="position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:1001; width:320px;">
      <input id="mapSearch" type="text" placeholder="Search location..." style="width:100%; padding:10px; border-radius:8px; border:1px solid #555; background:#111; color:white; font-size:16px;">
    </div>
    <div id="filterContainer" style="position:absolute; bottom:60px; left:10px; z-index:1000; background:rgba(255,255,255,0.9); padding:10px; border-radius:8px; display:flex; flex-wrap:wrap; gap:4px;"></div>
  </div>
</div>

<!-- Footer -->
<div id="footer-placeholder"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  // Load header/footer
  fetch('header.html').then(r=>r.text()).then(d=>document.getElementById('header-placeholder').innerHTML=d);
  fetch('footer.html').then(r=>r.text()).then(d=>document.getElementById('footer-placeholder').innerHTML=d);

  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyClEyiSXHQ4Tjo8hUKpjlgbGz3Y9fw8ddg",
    authDomain: "fieldops0.firebaseapp.com",
    databaseURL: "https://fieldops0-default-rtdb.firebaseio.com",
    projectId: "fieldops0",
    storageBucket: "fieldops0.appspot.com",
    messagingSenderId: "368782923118",
    appId: "1:368782923118:web:71f392fee8c46fe1209d7f"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  // Map
  const map = L.map('map').setView([25,-80],5);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19
  }).addTo(map);

  let currentUser=null, locations=[], markers=[], categoryColors={"Airsoft Field":"blue","Paintball Field":"red","Store":"green","Event":"orange"}, activeCategories=new Set(Object.keys(categoryColors));

  auth.onAuthStateChanged(user => { currentUser=user||null; loadFields(); });

  async function loadFields() {
    const snap = await db.ref('fields').once('value');
    const data = snap.val()||{};
    locations = Object.keys(data).map(k=>({id:k,...data[k]}));
    renderFilters();
    renderMarkers();
  }

  function createMarker(field){
    const tags = field.tags||[];
    const size = tags.includes("featured")?18:12;
    const htmlSlices = tags.map(tag=>`<div style="flex:1;background:${categoryColors[tag]||'gray'}"></div>`).join('');
    const iconHtml = `<div style="width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;display:flex;border:1px solid white;">${htmlSlices}</div>`;
    const marker = L.marker([field.latitude,field.longitude],{
      icon:L.divIcon({className:'multi-circle',html:iconHtml,iconSize:[size,size],iconAnchor:[size/2,size/2]})
    });
    marker.bindPopup(`<div style="width:220px;font-family:Arial;"><strong>${field.name}</strong><br><em>${field.avgPlayers||0} players (avg)</em><p>${field.desc||''}</p></div>`);
    return marker;
  }

  function renderMarkers(){
    markers.forEach(m=>map.removeLayer(m));
    markers=[];
    locations.forEach(f=>{
      if((f.tags||[]).some(tag=>activeCategories.has(tag))){
        const marker=createMarker(f);
        marker.addTo(map);
        markers.push(marker);
      }
    });
  }

  function renderFilters(){
    const container=document.getElementById('filterContainer');
    container.innerHTML='';
    Object.keys(categoryColors).forEach(tag=>{
      const btn=document.createElement('button');
      btn.innerText=tag;
      btn.style.background=activeCategories.has(tag)?categoryColors[tag]:'#ccc';
      btn.style.color=tag==='Event'?'black':'white';
      btn.style.border='none';
      btn.style.borderRadius='4px';
      btn.style.padding='4px 8px';
      btn.onclick=()=>{activeCategories.has(tag)?activeCategories.delete(tag):activeCategories.add(tag); renderFilters(); renderMarkers();}
      container.appendChild(btn);
    });
  }

  document.getElementById('mapSearch').addEventListener('keypress',async e=>{
    if(e.key==='Enter'){
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(e.target.value)}`);
      const data = await res.json();
      if(data[0]) map.setView([+data[0].lat,+data[0].lon],10);
    }
  });
</script>
</body>
</html>
