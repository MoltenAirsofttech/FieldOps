<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Finder - Field Ops</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <div id="header-placeholder"></div>

  <div class="pageContainer">
    <div id="adsSidebar">
      <h3>Ads</h3>
      <p>Google Ads here</p>
    </div>
    <div id="mainContent">
      <div id="version">v4.3</div>

      <div id="notLoggedIn">
        <p>You need to login/signup to use Group Finder.</p>
        <button id="goLoginBtn" onclick="location.href='login-signup.html'">Go to Login</button>
      </div>

      <div id="wrapper"></div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="groupfinder-script.js"></script>

  <script>
    fetch('header.html').then(r => r.text()).then(d => document.getElementById('header-placeholder').innerHTML = d);
    fetch('footer.html').then(r => r.text()).then(d => document.getElementById('footer-placeholder').innerHTML = d);
  </script>
</body>
</html>
